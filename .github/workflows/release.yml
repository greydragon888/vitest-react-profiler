name: Release

# Release automation: release-please + npm Trusted Publishing (OIDC)
#
# 1. Every push to master: release-please opens or updates the "release: vX.Y.Z" PR from
#    Conventional Commits (feat → minor; fix / perf / build / revert → patch; `!` → major).
# 2. Merging that PR: release-please tags vX.Y.Z and creates the GitHub Release.
# 3. Every run then reconciles npm: a tagged version that is missing from npm is published
#    from its tag. A failed publish is therefore retried by the next run or by "Run workflow".
#
# npm Trusted Publishing is bound to THIS file name (release.yml) with no environment:
# renaming the file or adding `environment:` breaks publishing until the Trusted Publisher
# on npmjs.com is updated. No NPM_TOKEN is used.
#
# Requires the RELEASE_PLEASE_TOKEN secret: a fine-grained PAT for this repository with
# Contents + Pull requests: read and write. GITHUB_TOKEN cannot be used here: Actions may
# not create pull requests in this repository, and PRs it creates would not trigger CI.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  # Never cancel a run between tagging and `npm publish`
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # npm Trusted Publishing requires a GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is not set: a fine-grained PAT for this repository with Contents + Pull requests read/write (see CONTRIBUTING.md, Versioning and Releases)."
            exit 1
          fi

      - name: Release PR / GitHub Release
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # After release-please, so a tag it has just created is fetched too
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check npm state
        id: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "status=$TAG is not tagged yet — nothing to publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only E404 means "not published"; any other registry error fails the run
          if npm view "$NAME@$VERSION" version > /dev/null 2> "$RUNNER_TEMP/npm-view.err"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "status=$NAME@$VERSION is already on npm" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" "$RUNNER_TEMP/npm-view.err"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "status=$TAG is tagged but missing on npm — publishing" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::Could not query npm for $NAME@$VERSION"
            exit 1
          fi

      # Publish exactly what was tagged, never a later master commit
      - name: Checkout release tag
        if: steps.npm.outputs.publish == 'true'
        env:
          TAG: ${{ steps.npm.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      - name: Setup Node.js
        if: steps.npm.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          # No registry-url: the .npmrc it writes (NODE_AUTH_TOKEN) conflicts with OIDC.
          # npm >= 11.5.1 (bundled with Node 24) exchanges the OIDC token itself.

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        # No lifecycle scripts in a job that can mint an OIDC token
        run: npm ci --ignore-scripts

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        # prepublishOnly runs typecheck, tests with coverage, build, attw, publint and knip first
        run: npm publish --provenance --access public

      - name: Verify publication
        if: steps.npm.outputs.publish == 'true'
        env:
          SPEC: ${{ steps.npm.outputs.name }}@${{ steps.npm.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "$SPEC" version > /dev/null 2>&1; then
              PROVENANCE=$(npm view "$SPEC" dist.attestations.provenance.predicateType)
              echo "$SPEC is on npm (provenance: ${PROVENANCE:-none})"
              if [ -z "$PROVENANCE" ]; then
                echo "::warning::$SPEC has no provenance attestation"
              fi
              exit 0
            fi
            echo "Attempt $attempt: $SPEC not visible yet"
            sleep 10
          done
          echo "::error::$SPEC was published but is not visible on npm after 60s"
          exit 1

      - name: Summary
        if: always()
        env:
          PRS_CREATED: ${{ steps.release-please.outputs.prs_created }}
          PR: ${{ steps.release-please.outputs.pr }}
          RELEASE_CREATED: ${{ steps.release-please.outputs.release_created }}
          TAG_NAME: ${{ steps.release-please.outputs.tag_name }}
          NPM_STATUS: ${{ steps.npm.outputs.status }}
          JOB_STATUS: ${{ job.status }}
        run: |
          PR_URL=$(printf '%s' "${PR:-}" | jq -r '.url // empty' 2> /dev/null || true)
          {
            echo "## Release"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Release PR created or updated | ${PRS_CREATED:-false}${PR_URL:+ ($PR_URL)} |"
            echo "| GitHub Release created | ${RELEASE_CREATED:-false}${TAG_NAME:+ ($TAG_NAME)} |"
            echo "| npm | ${NPM_STATUS:-not checked} |"
            echo "| Job status | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Fix the cause, then re-run: **Actions → Release → Run workflow** publishes any tagged version missing from npm." >> "$GITHUB_STEP_SUMMARY"
          fi
